<!-- sgct.dev integration -->
<script type="text/javascript">
(function() {
  // These pages are meant to be shown inside the iframe of https://sgct.dev/api, so a page
  // that is opened directly is sent there instead. Previewing the files from disk still works
  if (window.top === window && location.protocol !== 'file:') {
    const page = location.pathname.split('/').pop() + location.hash;
    location.replace('$relpath^../api?page=' + encodeURIComponent(page));
    return;
  }

  // Follow the light/dark switch in the site's navbar rather than having a separate one.
  // doxygen-awesome-css is styled through the `dark-mode` and `light-mode` classes
  const root = document.documentElement;
  const apply = (dark) => {
    root.classList.toggle('dark-mode', dark);
    root.classList.toggle('light-mode', !dark);
  };

  let parentRoot = null;
  try {
    parentRoot = window.parent.document.documentElement;
  }
  catch (e) {
    // Framed by a different origin, or opened from disk in a browser that treats every
    // file as its own origin
  }

  if (parentRoot && parentRoot !== root) {
    const sync = () => apply(parentRoot.dataset.theme === 'dark');
    sync();
    new MutationObserver(sync).observe(
      parentRoot,
      { attributes: true, attributeFilter: ['data-theme'] }
    );
  }
  else {
    // Use the choice made with the navbar switch, which Docusaurus keeps in `theme`
    let stored = null;
    try {
      stored = localStorage.getItem('theme');
    }
    catch (e) {
      // Storage is unavailable, for example when blocked or for files opened from disk
    }
    apply(
      stored === 'dark' || stored === 'light' ?
        stored === 'dark' :
        window.matchMedia('(prefers-color-scheme: dark)').matches
    );
  }
})();
</script>
